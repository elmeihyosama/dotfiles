#!/bin/sh
# btop rewrites btop.conf wholesale on quit, so chezmoi must not own the whole
# file. Pin only color_theme to the switcher-rendered theme and pass every
# other btop-owned setting through untouched.
set -eu
conf="$(cat)"
if [ -z "$conf" ]; then
  printf 'color_theme = "base16-active"\n'
elif printf '%s\n' "$conf" | grep -q '^color_theme'; then
  printf '%s\n' "$conf" | sed 's/^color_theme.*/color_theme = "base16-active"/'
else
  printf '%s\n' "$conf"
  printf 'color_theme = "base16-active"\n'
fi

# Tool catalog: the single source of truth for the CLI tools. Consumed by
# scripts/select-tools.sh, the Ansible playbook (loaded as `tool_catalog`, see
# ansible/site.yml), chezmoi templates (as .tools / .tool_groups), the doctor
# and assert scripts, and the `dotfiles` CLI/TUI.
#
# Per-tool fields:
#   group         one of tool_groups
#   bin           command name (default: the tool name)
#   backend       mise backend string (omitted for native_only / bootstrap)
#   version       exact pinned version, never "latest" (omitted for native_only)
#   native_on     OSes that use brew/native packages instead of mise
#   missing_on    locked platforms (<os>-<arch>: macos-arm64, linux-x64, linux-arm64)
#                 where upstream ships no release asset: select-tools reports
#                 source "native" there (best effort, like native_only)
#   native_only   never installed via mise (no usable release binary)
#   native_pkg    per-manager package name when it differs from the tool name
#   native_bin    informational: the binary name a distro package ships when it
#                 differs (apt: batcat/fdfind). Nothing reads it; these tools
#                 come from mise, which installs them under `bin`.
#   smoke         command that must exit 0 and print nothing
#   mise_options  extra options for the mise entry (e.g. rename_exe)
#   provided_by   this bin ships in another tool's package (age-keygen in age):
#                 never installed on its own, follows the provider's selection;
#                 doctor still checks the bin
#   bootstrap     installed by Ansible, not by mise (mise itself): select-tools
#                 reports source "bootstrap", the pins template skips it,
#                 doctor still checks it
#
# eza, git-absorb, gh-dash, editorconfig-checker use the github: backend (no
# aqua registry entry); atuin and yazi too, for its matching_regex (musl on
# Linux); everything else prefers aqua:.
# Pins are the versions installed on the maintainer's Mac when this was
# written, except tools that also appear in the repo root mise.toml (chezmoi,
# yq, uv, gitleaks, editorconfig-checker): those take the mise.toml version
# (tests/select-tools.test.sh enforces equality). 4.x editorconfig-checker
# names its binary editorconfig-checker, hence rename_exe.
tool_groups: [core, git, files, containers, system, media, dev]

tools:
  chezmoi:
    group: core
    backend: aqua:twpayne/chezmoi
    version: "2.73.2"
  mise:
    group: core
    bootstrap: true
    version: "2026.10.11"
  sheldon:
    group: core
    backend: aqua:rossmacarthur/sheldon
    version: "0.8.5"
  starship:
    group: core
    backend: aqua:starship/starship
    version: "1.24.1"
  fzf:
    group: core
    backend: aqua:junegunn/fzf
    version: "0.67.0"
  jq:
    group: core
    backend: aqua:jqlang/jq
    version: "1.8.2"
  yq:
    group: core
    backend: aqua:mikefarah/yq
    version: "4.54.1"
  zoxide:
    group: core
    backend: aqua:ajeetdsouza/zoxide
    version: "0.10.0"
  atuin:
    group: core
    backend: github:atuinsh/atuin
    version: "18.17.1"
    # musl on Linux: the gnu build needs glibc 2.39 (Debian 12, EL9 ship older)
    mise_options: {matching_regex: "^atuin-[a-z0-9_]+-(apple-darwin|unknown-linux-musl)[.]tar[.]gz$"}
  bat:
    group: core
    backend: aqua:sharkdp/bat
    version: "0.26.0"
    native_bin: {apt: batcat}
  eza:
    group: core
    backend: github:eza-community/eza
    version: "0.23.4"
    native_on: [darwin] # upstream ships no macOS binary (the github: backend picks the man-page tarball); brew builds it
  ripgrep:
    group: core
    bin: rg
    backend: aqua:BurntSushi/ripgrep
    version: "15.1.0"
  fd:
    group: core
    backend: aqua:sharkdp/fd
    version: "10.3.0"
    native_pkg: {apt: fd-find, dnf: fd-find}
    native_bin: {apt: fdfind}
  vivid:
    group: core
    backend: aqua:sharkdp/vivid
    version: "0.11.1"
  uv:
    group: core
    backend: aqua:astral-sh/uv
    version: "0.13.1"
  git-delta:
    group: git
    bin: delta
    backend: aqua:dandavison/delta
    version: "0.20.1"
  lazygit:
    group: git
    backend: aqua:jesseduffield/lazygit
    version: "0.56.0"
  gh:
    group: git
    backend: aqua:cli/cli
    version: "2.87.3"
  gh-dash:
    group: git
    backend: github:dlvhdr/gh-dash
    version: "4.26.2"
  git-absorb:
    group: git
    backend: github:tummychow/git-absorb
    version: "0.9.0"
    native_on: [darwin] # macOS asset is x86_64 only (the github: backend picks the man page on arm64); brew has it
    missing_on: [linux-arm64] # only a 32-bit arm (gnueabihf) Linux asset
  gitleaks:
    group: git
    backend: aqua:gitleaks/gitleaks
    version: "8.30.1"
  yazi:
    group: files
    backend: github:sxyazi/yazi
    version: "26.9.1"
    # musl on Linux: the gnu build needs glibc 2.39 (Debian 12, EL9 ship older)
    mise_options: {matching_regex: "^yazi-[a-z0-9_]+-(apple-darwin|unknown-linux-musl)[.]zip$"}
  dust:
    group: files
    backend: aqua:bootandy/dust
    version: "1.2.4"
    native_on: [darwin] # the macOS asset is x86_64 only (needs Rosetta 2, absent on a fresh Apple Silicon Mac); brew builds arm64
  duf:
    group: files
    backend: aqua:muesli/duf
    version: "0.9.1"
  age:
    group: files
    backend: aqua:FiloSottile/age
    version: "1.3.1"
  age-keygen:
    group: files
    provided_by: age
  lazydocker:
    group: containers
    backend: aqua:jesseduffield/lazydocker
    version: "0.24.2"
  btop:
    group: system
    backend: aqua:aristocratos/btop
    version: "1.4.7"
    native_on: [darwin]
  fastfetch:
    group: system
    backend: aqua:fastfetch-cli/fastfetch
    version: "2.65.2"
  zellij:
    group: system
    backend: aqua:zellij-org/zellij
    version: "0.44.3"
  navi:
    group: system
    backend: aqua:denisidoro/navi
    version: "2.24.0"
    native_on: [darwin]
  cava:
    group: media
    native_only: true  # karlstav/cava ships only source tarballs
  neovim:
    group: dev
    bin: nvim
    backend: aqua:neovim/neovim
    version: "0.11.5"
    smoke: "nvim --clean --headless -c qa"
  editorconfig-checker:
    group: dev
    bin: ec
    backend: github:editorconfig-checker/editorconfig-checker
    version: "4.0.2"
    mise_options: {rename_exe: ec}
  hyperfine:
    group: dev
    backend: aqua:sharkdp/hyperfine
    version: "1.20.0"
  xh:
    group: dev
    backend: aqua:ducaale/xh
    version: "0.26.2"
  jless:
    group: dev
    backend: aqua:PaulJuliusMartinez/jless
    version: "0.9.0"
    native_on: [linux] # the Linux binary links libxcb (clipboard): unusable on minimal/no-sudo hosts; distro package where there is one (no linux-arm64 asset either)
  watchexec:
    group: dev
    backend: aqua:watchexec/watchexec
    version: "2.5.1"

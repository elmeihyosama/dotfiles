# The same checks as CI; opt in per machine with `pre-commit install`.
repos:
  - repo: local
    hooks:
      - id: lint-shell
        name: shell (shellcheck/shfmt + render-aware zsh -n)
        entry: .github/scripts/lint.sh shell
        language: system
        pass_filenames: false
        files: '(\.(sh|zsh)(\.tmpl)?$|^home/dot_(zshenv|zshrc|bashrc|bash_profile)\.tmpl$)'
      - id: lint-lua
        name: lua (stylua --check)
        entry: .github/scripts/lint.sh lua
        language: system
        pass_filenames: false
        files: '\.lua(\.tmpl)?$'
      - id: lint-config
        name: config (render templates + parse yaml/toml/json)
        entry: .github/scripts/lint.sh config
        language: system
        pass_filenames: false
        files: '(\.tmpl|\.ya?ml|\.toml|\.json)$'
      - id: lint-ansible
        name: ansible (ansible-lint + syntax-check)
        entry: .github/scripts/lint.sh ansible
        language: system
        pass_filenames: false
        files: '^ansible/'
      - id: lint-editorconfig
        name: editorconfig (editorconfig-checker)
        entry: .github/scripts/lint.sh editorconfig
        language: system
        pass_filenames: false
      - id: lint-test
        name: test (tests/*.test.sh)
        entry: .github/scripts/lint.sh test
        language: system
        pass_filenames: false
      - id: lint-zizmor
        name: zizmor (workflow security audit)
        entry: .github/scripts/lint.sh zizmor
        language: system
        pass_filenames: false
        files: '^\.github/'
      - id: lint-actionlint
        name: actionlint (workflow syntax)
        entry: .github/scripts/lint.sh actionlint
        language: system
        pass_filenames: false
        files: '^\.github/(workflows|actions)/'
      - id: secret-scan
        name: secrets (gitleaks git --staged)
        entry: gitleaks git --staged --redact --no-banner .
        language: system
        pass_filenames: false

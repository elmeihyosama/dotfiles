---
- name: Provision dotfiles environment
  hosts: localhost
  connection: local
  gather_facts: true

  vars_files:
    - "{{ playbook_dir }}/local.yml"

  handlers:
    - name: Restart macOS UI services
      ansible.builtin.command: "killall {{ item }}"
      loop: [Finder, SystemUIServer]
      failed_when: false
      changed_when: true

  pre_tasks:
    # Loaded under a name, not vars_files, so its generic keys (`tools`,
    # `tool_groups`) cannot collide with other vars.
    - name: Load tool catalog
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../home/.chezmoidata/tools.yaml"
        name: tool_catalog
      tags: [always]

    - name: Detect passwordless sudo when allow_sudo is unset
      ansible.builtin.command: sudo -n true
      register: _sudo_probe
      changed_when: false
      failed_when: false
      when: allow_sudo is not defined

    - name: Set allow_sudo from probe when unset
      ansible.builtin.set_fact:
        allow_sudo: "{{ (_sudo_probe.rc | default(1)) == 0 }}"
      when: allow_sudo is not defined

    - name: Default shared_home off when unset
      ansible.builtin.set_fact:
        shared_home: false
      when: shared_home is not defined

    - name: Show effective install strategy
      ansible.builtin.debug:
        msg: >-
          os_family={{ ansible_facts.os_family }}
          pkg_mgr={{ ansible_facts.pkg_mgr | default('n/a') }}
          allow_sudo={{ allow_sudo }}
          shared_home={{ shared_home }}
          local_bin={{ local_bin }}

  # Every task gets mise_env (group_vars). Order: mise -> packages (core pins)
  # -> chezmoi (full pins) -> locked install of those -> the rest.
  tasks:
    - name: Pinned mise
      ansible.builtin.import_tasks: tasks/mise.yml
      environment: "{{ mise_env }}"
      tags: [mise, packages]

    - name: Packages
      ansible.builtin.import_tasks: tasks/packages.yml
      environment: "{{ mise_env }}"
      tags: [packages]

    - name: Chezmoi apply
      ansible.builtin.import_tasks: tasks/chezmoi.yml
      environment: "{{ mise_env }}"
      tags: [chezmoi]

    - name: Pinned tools (full selection)
      ansible.builtin.import_tasks: tasks/mise-install.yml
      environment: "{{ mise_env }}"
      tags: [packages, chezmoi]

    - name: GUI apps (macOS casks)
      ansible.builtin.import_tasks: tasks/casks.yml
      environment: "{{ mise_env }}"
      tags: [casks]
      when: ansible_facts.os_family == 'Darwin'

    - name: MacOS defaults
      ansible.builtin.import_tasks: tasks/macos.yml
      environment: "{{ mise_env }}"
      tags: [macos]
      when: ansible_facts.os_family == 'Darwin'

    - name: Zellij plugins
      ansible.builtin.import_tasks: tasks/zjstatus.yml
      environment: "{{ mise_env }}"
      tags: [zjstatus]

    - name: Python (uv-managed default interpreter)
      ansible.builtin.import_tasks: tasks/python.yml
      environment: "{{ mise_env }}"
      tags: [python]

    - name: Fonts
      ansible.builtin.import_tasks: tasks/fonts.yml
      environment: "{{ mise_env }}"
      tags: [fonts]

    - name: Sheldon plugins
      ansible.builtin.import_tasks: tasks/sheldon.yml
      environment: "{{ mise_env }}"
      tags: [sheldon]

    - name: Login shell
      ansible.builtin.import_tasks: tasks/shell.yml
      environment: "{{ mise_env }}"
      tags: [shell]

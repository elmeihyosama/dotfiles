---
# On a shared-$HOME multi-arch host (shared_home=true) arch-specific ELF binaries
# and runtimes must not collide, so bin/share dirs are suffixed with the machine
# architecture (x86_64 / aarch64 — ansible_facts.architecture == `uname -m`, which
# matches the user's existing ~/.local/bin-<arch> dirs). Default single-arch hosts
# keep the plain paths untouched.
local_bin: "{{ ansible_facts['env']['HOME'] }}/.local/bin{{ ('-' + ansible_facts['architecture']) if (shared_home | default(false)) else '' }}"
local_share: "{{ ansible_facts['env']['HOME'] }}/.local/share{{ ('-' + ansible_facts['architecture']) if (shared_home | default(false)) else '' }}"

# pinned versions
ubi_version: "latest"          # bootstrap script pulls the latest ubi release
nerd_font: "JetBrainsMono"
nerd_font_version: "v3.2.1"
python_version: "3.13"         # uv-managed default python
zjstatus_version: "v0.24.0"    # zellij status-bar plugin; bump manually + re-pin sha256
zjstatus_sha256: "1ccedece1ded62cf3e209be690cdd39ca6fb9e8228ed71a951f6507f9956669b"

# Canonical tool list (installed on every machine).
tools:
  - atuin
  - sheldon
  - zellij
  - navi
  - starship
  - zoxide
  - eza
  - bat
  - fd
  - ripgrep
  - fzf
  - git-delta
  - lazygit
  - lazydocker
  - yazi
  - jq
  - yq
  - gh
  - dust
  - duf
  - btop
  - neovim
  - gitleaks
  - editorconfig-checker
  - fastfetch
  - git-absorb
  - gh-dash
  - mise
  - cava

# owner/repo for the ubi no-sudo fallback
ubi_tool_repos:
  atuin: atuinsh/atuin
  sheldon: rossmacarthur/sheldon
  zellij: zellij-org/zellij
  navi: denisidoro/navi
  starship: starship/starship
  zoxide: ajeetdsouza/zoxide
  eza: eza-community/eza
  bat: sharkdp/bat
  fd: sharkdp/fd
  ripgrep: BurntSushi/ripgrep
  fzf: junegunn/fzf
  git-delta: dandavison/delta
  lazygit: jesseduffield/lazygit
  lazydocker: jesseduffield/lazydocker
  yazi: sxyazi/yazi
  jq: jqlang/jq
  yq: mikefarah/yq
  gh: cli/cli
  dust: bootandy/dust
  duf: muesli/duf
  btop: aristocratos/btop
  neovim: neovim/neovim
  gitleaks: gitleaks/gitleaks
  editorconfig-checker: editorconfig-checker/editorconfig-checker
  fastfetch: fastfetch-cli/fastfetch
  git-absorb: tummychow/git-absorb
  gh-dash: dlvhdr/gh-dash
  mise: jdx/mise

# tools whose extracted binary name differs from the canonical name (for ubi --exe)
ubi_exe_overrides:
  git-delta: delta
  ripgrep: rg
  gh: gh        # repo is cli/cli, but the binary inside the archive is `gh`
  neovim: nvim  # GitHub release extracts a binary named nvim
  editorconfig-checker: ec  # release archive ships ec-<os>-<arch>; binary we invoke is `ec`

# Force a specific ubi release asset when a tool ships multiple (e.g. glibc vs
# musl). yazi's gnu binary needs a very new glibc; the musl static build runs
# on any Linux, so we always pick it.
ubi_match_overrides:
  yazi: musl
  atuin: musl
  mise: musl

# Some projects publish assets that collide with `--matching` substrings across
# unrelated binaries. atuin's release ships atuin-server-*, cargo-dist self
# updater helpers (*-update), and the real CLI (atuin-*.tar.gz) — all of which
# contain "musl"/"gnu", so `--matching` alone can't tell them apart. Filter to
# the real CLI archive first via `--matching-regex`, then let `--matching`
# (above) pick musl vs gnu within that filtered set.
ubi_matching_regex_overrides:
  atuin: '^atuin-[a-z0-9_]+-unknown-linux-(gnu|musl)\.tar\.gz$'

# Homebrew formula names that differ from canonical (canonical name is used when
# a tool is absent here). Empty today — the default homebrew-core `dust` formula
# is correct, so no override is needed.
brew_formula_overrides: {}

# Homebrew installs a binary under a non-canonical name; symlink the canonical
# command into ~/.local/bin. Keyed canonical-command -> Homebrew binary name.
brew_bin_renames:
  ec: editorconfig-checker   # brew ships `editorconfig-checker`; ubi/CI ships `ec`

# --- Native package install (sudo path) ---------------------------------
# Per-manager package name, only when it differs from the canonical tool name.
# Tools absent here use the canonical name. dnf covers Fedora + RHEL/EPEL.
native_pkg_overrides:
  apt:
    fd: fd-find
  dnf:
    fd: fd-find
  pacman: {}

# Native package that installs the binary under a non-canonical name; we
# symlink the canonical name to it in ~/.local/bin. Keyed by manager, then tool.
native_bin_renames:
  apt:
    bat: batcat
    fd: fdfind
  dnf: {}
  pacman: {}

# Minimum acceptable version for tools whose configs need a floor. A native
# package below the floor is rejected in favour of ubi. Tools absent here
# accept whatever the repo ships.
min_versions:
  neovim: "0.9.0"
  # yq is also in force_ubi, so the native/ubi partition never consults this
  # floor for it — kept only because .github/scripts/assert-tools.sh re-reads min_versions to
  # verify the INSTALLED yq is 4.x (Debian apt ships the incompatible Python yq 3.x).
  yq: "4.0.0"

# Always install via ubi on Linux even when a native package exists — some distro
# builds are unreliable (Ubuntu apt ships gitleaks 8.16, pre-`git` CLI; Arch's build
# reports no version). The official ubi release is consistent. macOS uses Homebrew.
force_ubi:
  - gitleaks
  - yq # native "yq" is often the incompatible Python/jq wrapper (Arch, Debian); we need mikefarah yq
  - git-absorb # apt (debian/ubuntu) ships a package that installs no `git-absorb` on PATH; ubi is reliable

# Tools with NO Homebrew formula at all (verified against formulae.brew.sh —
# no homebrew-core formula/alias/oldname, and no formula in the upstream
# maintainer's own tap). On macOS these are installed via ubi into
# ~/.local/bin instead of `brew install`, same as the no-sudo Linux fallback.
brew_unavailable:
  - gh-dash # distributed as a `gh` CLI extension or raw GitHub release binaries; no brew formula/tap

# Tools with NO usable ubi binary release — upstream ships source-only archives,
# so ubi cannot install them. Provisioned via Homebrew (macOS) or the native
# package manager (sudo Linux); SKIPPED on no-sudo Linux. Non-critical eye-candy.
ubi_unavailable:
  - cava # karlstav/cava releases ship only cava-<v>.tar.gz (source) + a Windows .msi

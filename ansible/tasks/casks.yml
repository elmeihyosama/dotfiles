---
# GUI apps via Homebrew casks. The import in site.yml is gated to macOS; the
# brew check keeps a brew-less macOS box from failing (matches packages.yml).
# shell, not command: `command -v` is a shell builtin (see chezmoi.yml).
- name: Check for Homebrew  # noqa command-instead-of-shell
  ansible.builtin.shell: command -v brew
  register: _casks_brew
  changed_when: false
  failed_when: false

- name: Check which cask apps already exist
  ansible.builtin.stat:
    path: "/Applications/{{ item.value }}"
  register: _cask_apps
  loop: "{{ macos_casks | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: _casks_brew.rc == 0

# Guarded per-app on the bundle already existing: `brew install --cask`
# refuses to install over a manually-installed app, and machines that predate
# this task have them all installed by hand.
- name: Install GUI apps via Homebrew cask
  community.general.homebrew_cask:
    name: "{{ item.item.key }}"
    state: present
  loop: "{{ _cask_apps.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: _casks_brew.rc == 0 and not (item.stat.exists | default(true))

# Shim the editor CLI into the user bin dir so the antigravity-extensions
# chezmoi script works headlessly and regardless of install method (a brew
# cask install links it into brew's bin, a manual .dmg install links nothing).
# Stat-guarded: if a future app version moves/renames the CLI the shim is
# removed instead of left dangling.
- name: Check for the Antigravity IDE CLI inside the app bundle
  ansible.builtin.stat:
    path: "/Applications/Antigravity IDE.app/Contents/Resources/app/bin/antigravity-ide"
  register: _antigravity_cli

- name: Shim the Antigravity IDE CLI into the user bin dir
  ansible.builtin.file:
    src: "/Applications/Antigravity IDE.app/Contents/Resources/app/bin/antigravity-ide"
    dest: "{{ local_bin }}/antigravity-ide"
    state: link
  when: _antigravity_cli.stat.exists

- name: Remove a stale Antigravity IDE CLI shim
  ansible.builtin.file:
    path: "{{ local_bin }}/antigravity-ide"
    state: absent
  when: not _antigravity_cli.stat.exists

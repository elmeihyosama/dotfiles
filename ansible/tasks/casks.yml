---
# GUI apps via Homebrew casks (site.yml gates this to macOS); a brew-less Mac
# skips. shell, not command: `command -v` is a builtin (see chezmoi.yml).
- name: Check for Homebrew  # noqa command-instead-of-shell
  ansible.builtin.shell: command -v brew
  register: _casks_brew
  changed_when: false
  failed_when: false

- name: Check which cask apps already exist
  ansible.builtin.stat:
    path: "/Applications/{{ item.value }}"
  register: _cask_apps
  loop: "{{ macos_casks | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: _casks_brew.rc == 0

# Per-app guard: `brew install --cask` refuses to overwrite a manual install.
- name: Install GUI apps via Homebrew cask
  community.general.homebrew_cask:
    name: "{{ item.item.key }}"
    state: present
  loop: "{{ _cask_apps.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: _casks_brew.rc == 0 and not (item.stat.exists | default(true))

# Shim the editor CLI into the user bin dir so the extensions script works
# headless whatever the install method (a manual .dmg links nothing). A moved
# CLI removes the shim rather than leave it dangling.
- name: Check for the Antigravity IDE CLI inside the app bundle
  ansible.builtin.stat:
    path: "/Applications/Antigravity IDE.app/Contents/Resources/app/bin/antigravity-ide"
  register: _antigravity_cli

- name: Shim the Antigravity IDE CLI into the user bin dir
  ansible.builtin.file:
    src: "/Applications/Antigravity IDE.app/Contents/Resources/app/bin/antigravity-ide"
    dest: "{{ local_bin }}/antigravity-ide"
    state: link
  when: _antigravity_cli.stat.exists

- name: Remove a stale Antigravity IDE CLI shim
  ansible.builtin.file:
    path: "{{ local_bin }}/antigravity-ide"
    state: absent
  when: not _antigravity_cli.stat.exists

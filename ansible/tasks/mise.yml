---
# Pinned, sha256-checked mise binary in {{ local_bin }}; skipped when it already
# reports mise_version. Homebrew's mise, if any, is left alone.
- name: Map platform to mise release asset
  ansible.builtin.set_fact:
    _mise_os: "{{ {'Darwin': 'macos', 'Linux': 'linux'}[ansible_facts.system] | default('unsupported') }}"
    _mise_arch: "{{ {'x86_64': 'x64', 'amd64': 'x64', 'aarch64': 'arm64', 'arm64': 'arm64'}[ansible_facts.architecture] | default('unsupported') }}"

# Intel Macs are out: the tools are checksum-locked for these three platforms.
- name: Fail clearly on a platform outside the locked set
  ansible.builtin.fail:
    msg: >-
      Unsupported platform {{ ansible_facts.system }}/{{ ansible_facts.architecture }}:
      the dotfiles support Apple Silicon macOS (macos-arm64), linux-x64 and
      linux-arm64 only{{ '; Intel Macs are not supported' if ansible_facts.system == 'Darwin' else '' }}.
  when: >-
    (_mise_os ~ '-' ~ _mise_arch) not in mise_sha256

- name: Name the release asset
  ansible.builtin.set_fact:
    _mise_asset: "mise-v{{ mise_version }}-{{ _mise_os }}-{{ _mise_arch }}{{ '-musl' if _mise_os == 'linux' else '' }}"

- name: Read the installed mise version
  ansible.builtin.command: "{{ local_bin }}/mise --version"
  register: _mise_v
  changed_when: false
  failed_when: false

- name: Ensure local bin directory
  ansible.builtin.file:
    path: "{{ local_bin }}"
    state: directory
    mode: "0755"

# `dotfiles` as a command (bare `dotfiles` on a terminal opens the TUI). It
# finds the checkout through chezmoi at run time, so it always follows the one
# chezmoi applies from; installed here, not by chezmoi, so chezmoi never owns
# local_bin (whose mode the task above sets).
- name: Install the dotfiles command
  ansible.builtin.copy:
    dest: "{{ local_bin }}/dotfiles"
    mode: "0755"
    content: |
      #!/bin/sh
      # dotfiles: this repo's CLI, from the checkout chezmoi applies from.
      src="$(chezmoi source-path 2>/dev/null)" || {
        echo "dotfiles: chezmoi not found (or not set up)" >&2
        exit 1
      }
      exec sh "$(dirname "$src")/scripts/dotfiles.sh" "$@"

- name: Install pinned mise {{ mise_version }}
  ansible.builtin.get_url:
    url: "https://github.com/jdx/mise/releases/download/v{{ mise_version }}/{{ _mise_asset }}"
    dest: "{{ local_bin }}/mise"
    checksum: "sha256:{{ mise_sha256[_mise_os ~ '-' ~ _mise_arch] }}"
    mode: "0755"
    # ~130 MB: 120 s timed out (all retries) on a ~0.5 MB/s link
    timeout: 600
  register: _mise_dl
  until: _mise_dl is succeeded
  retries: 3
  delay: 5
  when: _mise_v.rc != 0 or not (_mise_v.stdout | trim).startswith(mise_version ~ ' ')

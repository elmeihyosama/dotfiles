---
# shell, not command: `command -v` is a shell builtin — there is no /usr/bin/command
# on Linux, so the command module can never resolve it there (macOS ships one,
# which masked this).
- name: Locate chezmoi  # noqa command-instead-of-shell
  ansible.builtin.shell: command -v chezmoi
  register: _chezmoi
  changed_when: false
  failed_when: false

- name: Fail clearly if chezmoi is missing
  ansible.builtin.fail:
    msg: "chezmoi not found (a core mise tool) — the packages task must run before chezmoi."
  when: _chezmoi.rc != 0

- name: Ensure chezmoi config dir
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/chezmoi"
    state: directory
    mode: "0755"

# `theme`/`wallpaper` and hand-written per-machine overrides (atuin_sync,
# sessionize_roots, ...) live in [data] of this file. Ansible rewrites it from
# a fixed key set, so read the existing [data] back first or they are lost.
- name: Read existing chezmoi.toml (to preserve machine-local [data] overrides)
  ansible.builtin.slurp:
    src: "{{ ansible_facts['env']['HOME'] }}/.config/chezmoi/chezmoi.toml"
  register: _cz_existing
  failed_when: false

# Raw `key = value` lines, so quoting and types survive. Keys Ansible writes
# are dropped (duplicate key = TOML error); comments and multi-line values are
# not carried.
- name: Carry over [data] keys Ansible does not own
  ansible.builtin.set_fact:
    _kept_data_lines: >-
      {{ _data_block | regex_findall('(?m)^[ \t]*([A-Za-z0-9_]+[ \t]*=.*?)[ \t]*$')
        | reject('match', '^(' ~ (_owned_keys | join('|')) ~ ')[ \t]*=')
        | list }}
  vars:
    _existing: "{{ _cz_existing.content | default('') | b64decode }}"
    # regex_findall: a '\1' argument to regex_search unescapes differently
    # across ansible-core releases.
    _data_block: >-
      {{ _existing | regex_findall('(?ms)^\[data\][ \t]*\n(.*?)(?=^\[|\Z)')
        | default([''], true) | first }}
    _owned_keys:
      - allow_sudo
      - shared_home
      - git_name
      - git_email
      - personal_git_name
      - personal_git_email
      - personal_git_dirs
      - selected_tools

# Tools to pin via mise on this machine (OS-filtered, source == mise only), so
# the pins template renders exactly what select-tools.sh would install. Needs
# jq + yq on PATH. Without selected_tools in chezmoi.toml the template falls
# back to every mise-capable tool.
- name: Select tools for this machine
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/../scripts/select-tools.sh"
      - --os
      - "{{ 'darwin' if ansible_facts['system'] == 'Darwin' else 'linux' }}"
      - --arch
      - "{{ 'x64' if ansible_facts['architecture'] in ['x86_64', 'amd64'] else 'arm64' }}"
      - --local
      - "{{ playbook_dir }}/local.yml"
  register: _selected_tools_raw
  changed_when: false
  check_mode: false

- name: Template chezmoi.toml from per-machine vars
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/chezmoi/chezmoi.toml"
    mode: "0600"
    content: |
      sourceDir = "{{ playbook_dir | dirname }}"
      {% if age_recipient is defined %}
      # Opt-in age encryption (see docs/secrets.md). The identity file is
      # per-machine and never committed; sync it out-of-band.
      encryption = "age"
      [age]
          identity = "~/.config/chezmoi/key.txt"
          recipient = "{{ age_recipient }}"
      {% endif %}
      [data]
      {% for line in _kept_data_lines %}
          {{ line }}
      {% endfor %}
      {% if personal_git_name is defined %}
          personal_git_name = "{{ personal_git_name }}"
      {% endif %}
      {% if personal_git_email is defined %}
          personal_git_email = "{{ personal_git_email }}"
      {% endif %}
      {% if personal_git_dirs is defined %}
          personal_git_dirs = {{ personal_git_dirs | to_json }}
      {% endif %}
          allow_sudo = {{ allow_sudo | lower }}
          shared_home = {{ shared_home | default(false) | lower }}
          git_name = "{{ git_name }}"
          git_email = "{{ git_email }}"
          selected_tools = {{ _selected_tools_raw.stdout | from_json | selectattr('source', 'eq', 'mise') | map(attribute='name') | list | to_json }}

- name: Check for pending chezmoi changes
  ansible.builtin.command: "{{ _chezmoi.stdout }} status"
  register: _cz_status
  changed_when: false

# --force: skip prompts (need a TTY) when a managed file changed outside chezmoi.
# Pre-existing files are backed up first by the run_once backup script.
- name: Apply chezmoi (only when there are pending changes)
  ansible.builtin.command: "{{ _chezmoi.stdout }} apply --force"
  register: _cz_apply
  when: _cz_status.stdout | length > 0
  changed_when: true

# Surfaces run_onchange script noise (a "command not found" here means a
# script ran before the tool it needs was installed; CI greps for it).
- name: Show chezmoi apply output
  ansible.builtin.debug:
    msg: "{{ (_cz_apply.stdout_lines | default([])) + (_cz_apply.stderr_lines | default([])) }}"
  when: >-
    _cz_apply is changed
    and ((_cz_apply.stdout | default('')) ~ (_cz_apply.stderr | default(''))) | length > 0

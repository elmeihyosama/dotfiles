---
# Packages. CLI tools come from mise (pinned, checksum-locked); the OS package
# manager only provides the bootstrap essentials and the few tools mise
# cannot (tools.yaml native_on / native_only / missing_on). Runs after
# tasks/mise.yml (the pinned mise binary). Fresh-machine order, since chezmoi
# is itself a mise tool and cannot render the first pins:
#   1. essentials (sudo Linux)
#   2. CORE-only pins + the repo lock into ~/.config/mise-dotfiles (only when
#      absent: on a re-run the chezmoi-deployed full pins and lock are a
#      consistent pair, and rewriting them would ping-pong with chezmoi)
#   3. locked install of those pins (tasks/mise-install.yml)
#   4. select-tools, one-time legacy ubi cleanup, native tools
# then tasks/chezmoi.yml deploys the full pins and site.yml runs the locked
# install again for the full selection.
- name: Set package-manager facts
  ansible.builtin.set_fact:
    _pkgmgr: "{{ 'dnf' if ansible_facts.pkg_mgr == 'dnf5' else ansible_facts.pkg_mgr }}"
    _native_linux: "{{ ansible_facts.system == 'Linux' and ansible_facts.pkg_mgr in ['apt', 'pacman', 'dnf', 'dnf5'] and (allow_sudo | bool) }}"

# ---- 1. Bootstrap essentials (sudo Linux) --------------------------------
- name: Refresh apt metadata
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600 # skip the refresh if apt metadata is < 1h old
  when: _native_linux and _pkgmgr == 'apt'

- name: Refresh pacman metadata
  become: true
  ansible.builtin.command: pacman -Sy --noconfirm
  changed_when: false
  when: _native_linux and _pkgmgr == 'pacman'

# Only the commands that are missing: EL9/EL10 images ship curl-minimal, which
# provides the curl command but conflicts with the curl package, and asking dnf
# for `curl` there fails the run. Each package is named after its command.
# shell, not command: `command -v` is a shell builtin (see chezmoi.yml).
- name: Find missing bootstrap essentials  # noqa command-instead-of-shell
  ansible.builtin.shell: |
    for c in git curl zsh unzip tar; do
      command -v "$c" >/dev/null 2>&1 || echo "$c"
    done
  register: _missing_essentials
  changed_when: false
  check_mode: false
  when: _native_linux

- name: Install missing bootstrap essentials (git, curl, zsh, unzip, tar)
  become: true
  ansible.builtin.package:
    name: "{{ _missing_essentials.stdout_lines }}"
    state: present
  when: _native_linux and _missing_essentials.stdout_lines | length > 0

# ---- 2. Core pins + lock (fresh machine only) ----------------------------
# No mode: chezmoi owns this dir after the first apply and creates it with the
# user's umask (0775 under umask 002); forcing 0755 here would flip it back
# and forth on every run.
- name: Ensure the dotfiles mise config dir  # noqa risky-file-permissions
  ansible.builtin.file:
    path: "{{ mise_config_root }}"
    state: directory

- name: Write the core-only bootstrap pins (only when no pins exist yet)
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/mise-pins.toml.j2"
    dest: "{{ mise_config_root }}/config.toml"
    mode: "0644"
    force: false
  vars:
    mise_pin_names: >-
      {{ tool_catalog.tools | dict2items | selectattr('value.group', 'equalto', 'core')
         | map(attribute='key') | sort }}
    mise_pin_os: "{{ 'darwin' if ansible_facts.system == 'Darwin' else 'linux' }}"
    mise_pin_plat: "{{ _mise_os }}-{{ _mise_arch }}"

- name: Copy the repo mise lock beside them (only when absent)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../home/dot_config/mise-dotfiles/mise.lock"
    dest: "{{ mise_config_root }}/mise.lock"
    mode: "0644"
    force: false

# ---- 3. Locked install of whatever is pinned now -------------------------
- name: Install the pinned core tools
  ansible.builtin.import_tasks: mise-install.yml

# ---- 4. Selection, legacy cleanup, native tools --------------------------
- name: Select tools for this machine
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/../scripts/select-tools.sh"
      - --os
      - "{{ 'darwin' if ansible_facts.system == 'Darwin' else 'linux' }}"
      - --arch
      - "{{ _mise_arch }}"
      - --local
      - "{{ playbook_dir }}/local.yml"
  register: _tool_selection
  changed_when: false
  check_mode: false

# Before mise, tools were ubi binaries in local_bin (plus rename symlinks and
# the neovim tree in local_opt). One-shot (the script runs only while the
# legacy ubi binary or neovim tree exists, and removes them last) and limited
# to the bins this host now gets from mise, so user binaries for native or
# deselected tools are never touched.
- name: Remove legacy ubi installs (one-time migration)
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/../scripts/cleanup-ubi.sh"
      - "{{ local_bin }}"
      - "{{ local_opt }}"
      - "{{ playbook_dir }}/../home/.chezmoidata/tools.yaml"
      - "{{ _tool_selection.stdout }}"
  register: _ubi_cleanup
  changed_when: _ubi_cleanup.stdout | length > 0

- name: Report removed legacy files
  ansible.builtin.debug:
    msg: "{{ _ubi_cleanup.stdout_lines }}"
  when: _ubi_cleanup.stdout | length > 0

- name: List the native tools (brew / distro packages)
  ansible.builtin.set_fact:
    _native_tools: "{{ _tool_selection.stdout | from_json | selectattr('source', 'equalto', 'native') | map(attribute='name') | list }}"

# shell, not command: `command -v` is a shell builtin (see chezmoi.yml).
- name: Check for Homebrew (macOS)  # noqa command-instead-of-shell
  ansible.builtin.shell: command -v brew
  register: _brew
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts.os_family == 'Darwin'

- name: Warn that Homebrew is missing (macOS)
  ansible.builtin.debug:
    msg: >-
      WARNING: Homebrew not found; {{ _native_tools }} come from brew on macOS
      and stay uninstalled. Install Homebrew (https://brew.sh) and re-run.
  when:
    - ansible_facts.os_family == 'Darwin'
    - _brew.rc != 0
    - _native_tools | length > 0

# A missing package is a warning, not a failure: native tools are the
# best-effort ones (source-only upstreams, no asset for this platform).
- name: Install native tools via Homebrew (macOS)
  community.general.homebrew:
    name: "{{ (tool_catalog.tools[item].native_pkg | default({})).brew | default(item) }}"
    state: present
  loop: "{{ _native_tools }}"
  register: _native_brew
  ignore_errors: true # noqa ignore-errors
  when: ansible_facts.os_family == 'Darwin' and _brew.rc == 0

- name: Install native tools via the distro package manager (sudo Linux)
  become: true
  ansible.builtin.package:
    name: "{{ (tool_catalog.tools[item].native_pkg | default({}))[_pkgmgr] | default(item) }}"
    state: present
  loop: "{{ _native_tools }}"
  register: _native_linux_pkgs
  ignore_errors: true # noqa ignore-errors
  when: _native_linux

- name: Warn about native tools that could not be installed
  ansible.builtin.debug:
    msg: >-
      WARNING: no package for {{ _missing }} on this host
      ({{ ansible_facts.distribution }} {{ _pkgmgr }}); they stay uninstalled.
  vars:
    _results: "{{ (_native_brew.results | default([])) + (_native_linux_pkgs.results | default([])) }}"
    _missing: "{{ _results | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='item') | list }}"
  when: _missing | length > 0

- name: Warn about native tools skipped without sudo
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ _native_tools }} need the system package manager (no sudo
      here); they stay uninstalled.
  when:
    - ansible_facts.system == 'Linux'
    - not _native_linux
    - _native_tools | length > 0

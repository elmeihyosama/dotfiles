---
# macOS user defaults: the list lives in group_vars/all.yml (macos_defaults).
- name: Ensure the screenshot directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/Pictures/Screenshots"
    state: directory
    mode: "0755"

# The handler (site.yml) restarts Finder/SystemUIServer only on a change.
- name: Apply macOS defaults
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
  loop: "{{ macos_defaults }}"
  loop_control:
    label: "{{ item.domain }}:{{ item.key }}"
  notify: Restart macOS UI services

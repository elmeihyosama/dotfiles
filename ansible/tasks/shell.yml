---
# zsh has no static upstream build: macOS ships it, apt + sudo installs it,
# anywhere else it must already be there (install.sh says so up front).
- name: Install zsh (Debian/Ubuntu with sudo)
  become: true
  ansible.builtin.apt:
    name: zsh
    state: present
  when:
    - ansible_facts.system == 'Linux'
    - ansible_facts.pkg_mgr == 'apt'
    - allow_sudo | default(false)

# shell, not command: `command -v` is a builtin (see chezmoi.yml).
- name: Resolve zsh path  # noqa command-instead-of-shell
  ansible.builtin.shell: command -v zsh
  register: _zsh
  changed_when: false
  failed_when: false

# The passwd entry, not $SHELL: that only changes on a fresh login.
- name: Set login shell to zsh (only with sudo; no-sudo machines use the .bashrc shim)
  when:
    - allow_sudo | default(false)
    - _zsh.rc == 0
    - ansible_facts['user_shell'] | default('') != _zsh.stdout
  block:
    - name: Ensure zsh is listed in /etc/shells
      become: true
      ansible.builtin.lineinfile:
        path: /etc/shells
        line: "{{ _zsh.stdout }}"
        state: present
      failed_when: false

    # become: without a TTY chsh's PAM prompt failed (and, tolerated, looked
    # `ok`). As root there is no prompt, but the user must be named.
    - name: Change login shell to zsh for the current user
      become: true
      ansible.builtin.command: "chsh -s {{ _zsh.stdout }} {{ ansible_facts['user_id'] }}"
      register: _chsh
      changed_when: _chsh.rc == 0
      failed_when: false

    # A silent chsh failure looks like success; rc is absent if become failed.
    - name: Warn when the login shell could not be changed
      ansible.builtin.debug:
        msg: >-
          WARNING: chsh failed (rc={{ _chsh.rc | default('n/a') }}): {{ _chsh.stderr | default(_chsh.msg | default('')) | trim }}.
          Login shell is still {{ ansible_facts['user_shell'] | default('unknown') }}
          — set it manually with: sudo chsh -s {{ _zsh.stdout }} {{ ansible_facts['user_id'] }}
      when: _chsh.rc | default(1) != 0

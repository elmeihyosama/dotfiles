name: Lint
on:
  pull_request:
  push:
    branches: [main]
  # Weekly run catches upstream drift (new tool releases, base images) between PRs.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

# Read-only ephemeral token — lint jobs only read the repo (they never push).
permissions:
  contents: read

jobs:
  lint:
    # Stable check name = just the area ("shell", "config", …), so the
    # required-status-check contexts (a repo ruleset pins them) don't change
    # when the install/run commands change. Without an explicit name the matrix
    # appends the full command string to the job name, so every command edit
    # silently renames the checks and breaks the ruleset.
    name: ${{ matrix.area }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: shell
            run: ./.github/scripts/lint.sh shell
          - area: lua
            # luajit parse-checks rendered *.lua.tmpl (the rest is mise-pinned).
            install: sudo apt-get install -y -qq luajit
            run: ./.github/scripts/lint.sh lua
          - area: config
            run: ./.github/scripts/lint.sh config
          - area: ansible
            install: ansible-galaxy collection install -r ansible/requirements.yml
            run: ./.github/scripts/lint.sh ansible
          - area: editorconfig
            run: ./.github/scripts/lint.sh editorconfig
          - area: test
            run: ./.github/scripts/lint.sh test
          - area: zizmor
            run: ./.github/scripts/lint.sh zizmor
          - area: actionlint
            run: ./.github/scripts/lint.sh actionlint
          - area: lock
            run: ./.github/scripts/lint.sh lock
          - area: secret-scan
            run: gitleaks git --no-banner --redact .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Quote the operands: GH Actions `&&`/`||` return the operand and 0 is
          # FALSY, so `&& 0` would fall through to `|| 1` and secret-scan would get
          # a shallow clone (gitleaks needs full history). '0'/'1' are truthy.
          fetch-depth: ${{ matrix.area == 'secret-scan' && '0' || '1' }}
          persist-credentials: false
      # zizmor's self-repository rule wants `$/.github/...`, but actionlint
      # 1.7.12 rejects that syntax as an invalid action reference. The checkout
      # above is persist-credentials:false from this same repo, so the
      # workspace-relative form carries no extra risk; revisit when actionlint
      # learns `$/`.
      - uses: ./.github/actions/setup-lint # zizmor: ignore[self-repository]
      - name: Install ${{ matrix.area }} extras
        if: matrix.install
        shell: bash
        env:
          INSTALL: ${{ matrix.install }}
        run: eval "$INSTALL"
      - name: Run ${{ matrix.area }}
        shell: bash
        env:
          RUN: ${{ matrix.run }}
        run: eval "$RUN"

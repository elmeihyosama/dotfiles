name: Lint
# Called by ci.yml, which decides when this runs; dispatchable by hand.
on:
  workflow_call:
  workflow_dispatch:

# Lint jobs only read the repo.
permissions:
  contents: read

jobs:
  lint:
    # Explicit name = just the area: the matrix would otherwise append the
    # command to the check name.
    name: ${{ matrix.area }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: shell
            run: ./.github/scripts/lint.sh shell
          - area: lua
            # luajit parse-checks rendered *.lua.tmpl (the rest is mise-pinned).
            install: sudo apt-get install -y -qq luajit
            run: ./.github/scripts/lint.sh lua
          - area: config
            run: ./.github/scripts/lint.sh config
          - area: ansible
            install: ansible-galaxy collection install -r ansible/requirements.yml
            run: ./.github/scripts/lint.sh ansible
          - area: editorconfig
            run: ./.github/scripts/lint.sh editorconfig
          - area: test
            run: ./.github/scripts/lint.sh test
          - area: zizmor
            # Online audits (e.g. impostor-commit) need a token.
            run: ZIZMOR_ONLINE=1 ./.github/scripts/lint.sh zizmor
          - area: actionlint
            run: ./.github/scripts/lint.sh actionlint
          - area: lock
            run: ./.github/scripts/lint.sh lock
          - area: secret-scan
            run: gitleaks git --no-banner --redact .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Quoted: in Actions `&& 0` is falsy and would fall through to `|| 1`;
          # secret-scan needs full history for gitleaks.
          fetch-depth: ${{ matrix.area == 'secret-scan' && '0' || '1' }}
          persist-credentials: false
      # zizmor wants `$/.github/...`, which actionlint 1.7.12 rejects; the
      # same-repo, credential-less checkout makes this form safe; revisit when
      # actionlint learns `$/`.
      - uses: ./.github/actions/setup-lint # zizmor: ignore[self-repository]
      - name: Install ${{ matrix.area }} extras
        if: matrix.install
        shell: bash
        env:
          INSTALL: ${{ matrix.install }}
        run: eval "$INSTALL"
      - name: Run ${{ matrix.area }}
        shell: bash
        env:
          RUN: ${{ matrix.run }}
          # zizmor's online audits only.
          GH_TOKEN: ${{ matrix.area == 'zizmor' && github.token || '' }}
        run: eval "$RUN"

name: Lint
on:
  pull_request:
  push:
    branches: [main]

# Read-only ephemeral token — lint jobs only read the repo (they never push).
permissions:
  contents: read

jobs:
  lint:
    # Stable check name derived only from the area, so the required-status-check
    # contexts (a repo ruleset pins them) stay "lint (shell)", "lint (config)",
    # … regardless of how the install/run commands change. Without this, the
    # matrix appends the full command string to the job name and every command
    # edit silently renames the checks and breaks the ruleset.
    name: lint (${{ matrix.area }})
    runs-on: ubuntu-latest
    # ubi (chezmoi + the linter binaries) queries api.github.com for releases;
    # give it the token so it uses the authenticated 5000/hr limit, not the
    # anonymous 60/hr-per-IP one (which the matrix exhausts).
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: shell
            install: |
              ubi --project koalaman/shellcheck --in "$HOME/.local/bin"
              ubi --project mvdan/sh --in "$HOME/.local/bin" --exe shfmt
            run: ./.github/scripts/lint.sh shell
          - area: lua
            install: |
              sudo apt-get install -y -qq luajit
              ubi --project JohnnyMorganz/StyLua --in "$HOME/.local/bin" --exe stylua
            run: ./.github/scripts/lint.sh lua
          - area: config
            install: ubi --project mikefarah/yq --in "$HOME/.local/bin"
            run: ./.github/scripts/lint.sh config
          - area: ansible
            install: |
              python3 -m pip install --quiet --break-system-packages ansible-core ansible-lint
              ansible-galaxy collection install -r ansible/requirements.yml
            run: ./.github/scripts/lint.sh ansible
          - area: editorconfig
            install: ubi --project editorconfig-checker/editorconfig-checker --in "$HOME/.local/bin" --exe ec
            run: ./.github/scripts/lint.sh editorconfig
          - area: secret-scan
            install: ubi --project gitleaks/gitleaks --in "$HOME/.local/bin"
            run: gitleaks git --no-banner --redact .
    steps:
      - uses: actions/checkout@v4
        with:
          # Quote the operands: GH Actions `&&`/`||` return the operand and 0 is
          # FALSY, so `&& 0` would fall through to `|| 1` and secret-scan would get
          # a shallow clone (gitleaks needs full history). '0'/'1' are truthy.
          fetch-depth: ${{ matrix.area == 'secret-scan' && '0' || '1' }}
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
      - name: Install ${{ matrix.area }} tools
        shell: bash
        run: ${{ matrix.install }}
      - name: Run ${{ matrix.area }}
        shell: bash
        run: ${{ matrix.run }}

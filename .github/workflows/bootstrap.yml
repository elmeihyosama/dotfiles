name: Bootstrap
on:
  pull_request:
    paths:
      - 'install.sh'
      - 'ansible/**'
      - 'home/**'
      - 'scripts/select-tools.sh'
      - 'scripts/cleanup-ubi.sh'
      - 'scripts/remove-hint.sh' # sourced by assert-tools.sh / doctor.sh
      - 'scripts/mise-env.sh' # sourced by assert-tools.sh / doctor.sh / dotfiles.sh
      - '.github/scripts/bootstrap-smoke.sh'
      - '.github/scripts/assert-tools.sh'
      - '.github/scripts/assert-idempotent.sh'
      - '.github/workflows/bootstrap.yml'
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'ansible/**'
      - 'home/**'
      - 'scripts/select-tools.sh'
      - 'scripts/cleanup-ubi.sh'
      - 'scripts/remove-hint.sh' # sourced by assert-tools.sh / doctor.sh
      - 'scripts/mise-env.sh' # sourced by assert-tools.sh / doctor.sh / dotfiles.sh
      - '.github/scripts/bootstrap-smoke.sh'
      - '.github/scripts/assert-tools.sh'
      - '.github/scripts/assert-idempotent.sh'
      - '.github/workflows/bootstrap.yml'
  # Weekly: catches upstream drift (tool releases, base images) between PRs.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

# GITHUB_TOKEN goes into the container only to raise mise's API rate limit.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    # The entry point itself (install.sh end-to-end) on an apt and a dnf host.
    name: bootstrap ${{ matrix.distro }} (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, fedora]
        mode: [sudo, nosudo]
        # Digest-pinned like provision.yml (tests/ci-pins.test.sh keeps them equal).
        include:
          - distro: ubuntu
            image: mirror.gcr.io/library/ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac # 24.04
          - distro: fedora
            image: mirror.gcr.io/library/fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 # 44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap (${{ matrix.image }} / ${{ matrix.mode }})
        run: |
          # Same retry loop as provision.yml.
          for attempt in 1 2 3; do
            echo "::group::bootstrap attempt $attempt"
            # Higher ceiling than provision: the full playbook runs twice.
            if timeout 1500 docker run --rm \
              -e MODE='${{ matrix.mode }}' \
              -e GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
              -v "$PWD:/repo" -w /repo \
              '${{ matrix.image }}' \
              sh .github/scripts/bootstrap-smoke.sh; then
              echo "::endgroup::"; exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed" >&2
            docker ps -q | xargs -r docker kill >/dev/null 2>&1 || true
            [ "$attempt" -lt 3 ] && sleep 15
          done
          exit 1

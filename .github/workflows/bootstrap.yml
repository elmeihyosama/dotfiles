name: Bootstrap
on:
  pull_request:
    paths:
      - 'install.sh'
      - 'ansible/**'
      - 'home/**'
      - 'scripts/select-tools.sh'
      - 'scripts/cleanup-ubi.sh'
      - 'scripts/remove-hint.sh' # sourced by assert-tools.sh / doctor.sh
      - '.github/scripts/bootstrap-smoke.sh'
      - '.github/scripts/assert-tools.sh'
      - '.github/scripts/assert-idempotent.sh'
      - '.github/workflows/bootstrap.yml'
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'ansible/**'
      - 'home/**'
      - 'scripts/select-tools.sh'
      - 'scripts/cleanup-ubi.sh'
      - 'scripts/remove-hint.sh' # sourced by assert-tools.sh / doctor.sh
      - '.github/scripts/bootstrap-smoke.sh'
      - '.github/scripts/assert-tools.sh'
      - '.github/scripts/assert-idempotent.sh'
      - '.github/workflows/bootstrap.yml'
  # Weekly run catches upstream drift (new tool releases, base images) between PRs.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

# Read-only ephemeral token, passed into the container only to raise mise's
# GitHub API rate limit (same rationale as provision.yml).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    # The provision matrix covers per-distro package installs; this job covers
    # the entry point itself (install.sh end-to-end) on an apt (Ubuntu) and a
    # dnf (Fedora) host.
    name: bootstrap ${{ matrix.distro }} (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, fedora]
        mode: [sudo, nosudo]
        # Digest-pinned like provision.yml (bump both files together; see the
        # note there; tests/ci-pins.test.sh fails if the copies diverge).
        include:
          - distro: ubuntu
            image: mirror.gcr.io/library/ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac # 24.04
          - distro: fedora
            image: mirror.gcr.io/library/fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 # 44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap (${{ matrix.image }} / ${{ matrix.mode }})
        run: |
          # Same 3-retry pattern as provision.yml: absorb transient network
          # blips; install.sh and the playbook are idempotent, so a retry only
          # redoes what actually failed.
          for attempt in 1 2 3; do
            echo "::group::bootstrap attempt $attempt"
            # Same per-attempt bound + orphan-kill as provision.yml; bootstrap
            # runs the full playbook (uv python, font, two passes), so the
            # ceiling is higher than provision's.
            if timeout 1500 docker run --rm \
              -e MODE='${{ matrix.mode }}' \
              -e GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
              -v "$PWD:/repo" -w /repo \
              '${{ matrix.image }}' \
              sh .github/scripts/bootstrap-smoke.sh; then
              echo "::endgroup::"; exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed" >&2
            docker ps -q | xargs -r docker kill >/dev/null 2>&1 || true
            [ "$attempt" -lt 3 ] && sleep 15
          done
          exit 1

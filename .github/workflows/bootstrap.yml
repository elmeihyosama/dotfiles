name: Bootstrap
# Called by ci.yml, which decides when this runs; dispatchable by hand.
on:
  workflow_call:
  workflow_dispatch:

# GITHUB_TOKEN goes into the container only to raise mise's API rate limit.
permissions:
  contents: read

jobs:
  bootstrap:
    # The entry point itself (install.sh end-to-end, curl | sh), as a user
    # without sudo on Ubuntu: the user-local path every Linux can take.
    name: bootstrap ${{ matrix.distro }} (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu]
        mode: [nosudo]
        # Digest-pinned (tests/ci-pins.test.sh); Renovate bumps tag and digest.
        include:
          - distro: ubuntu
            image: mirror.gcr.io/library/ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac # 24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap (${{ matrix.image }} / ${{ matrix.mode }})
        run: |
          # Retried: the network (GitHub, mirrors) flakes.
          for attempt in 1 2 3; do
            echo "::group::bootstrap attempt $attempt"
            # The full playbook runs twice (idempotence).
            if timeout 1500 docker run --rm \
              -e MODE='${{ matrix.mode }}' \
              -e GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
              -v "$PWD:/repo" -w /repo \
              '${{ matrix.image }}' \
              sh .github/scripts/bootstrap-smoke.sh; then
              echo "::endgroup::"; exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed" >&2
            docker ps -q | xargs -r docker kill >/dev/null 2>&1 || true
            [ "$attempt" -lt 3 ] && sleep 15
          done
          exit 1

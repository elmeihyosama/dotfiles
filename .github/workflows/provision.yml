name: Provision
on:
  pull_request:
    paths:
      - 'ansible/**'
      - 'ci/provision-ci.sh'
      - 'ci/assert-tools.sh'
      - '.github/workflows/provision.yml'
  push:
    branches: [main]
    paths:
      - 'ansible/**'
      - 'ci/provision-ci.sh'
      - 'ci/assert-tools.sh'
      - '.github/workflows/provision.yml'

jobs:
  provision:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pull from mirror.gcr.io (Google's Docker Hub mirror) + quay.io, not
        # Docker Hub directly — GitHub Actions' shared runner IPs hit Docker
        # Hub's anonymous pull limit and the daemon times out. Same images;
        # provision-ci.sh detects the distro by package manager, not image name.
        distro:
          - mirror.gcr.io/library/debian:bookworm-slim
          - mirror.gcr.io/library/ubuntu:24.04
          - mirror.gcr.io/library/archlinux:latest
          - mirror.gcr.io/library/fedora:latest
          - quay.io/rockylinux/rockylinux:9
          - quay.io/rockylinux/rockylinux:10
        mode: [sudo, nosudo]
    steps:
      - uses: actions/checkout@v4
      - name: Provision (${{ matrix.distro }} / ${{ matrix.mode }})
        run: |
          docker run --rm \
            -e MODE='${{ matrix.mode }}' \
            -e GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
            -v "$PWD:/repo" -w /repo \
            '${{ matrix.distro }}' \
            sh ci/provision-ci.sh

name: Provision
# Called by ci.yml, which decides when this runs; dispatchable by hand.
on:
  workflow_call:
  workflow_dispatch:

# GITHUB_TOKEN goes into the container only to raise mise's API rate limit.
permissions:
  contents: read

jobs:
  provision:
    # Short check name; the image rides in matrix.image.
    name: ${{ matrix.distro }} (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, ubuntu, arch, fedora, rocky9, rocky10]
        mode: [sudo, nosudo]
        # mirror.gcr.io and quay.io, not Docker Hub: shared runner IPs hit its
        # anonymous pull limit. Images are pinned to the multi-arch index
        # digest; Renovate bumps them with bootstrap.yml's copies in one PR
        # (tests/ci-pins.test.sh fails if they diverge). By hand:
        #   docker buildx imagetools inspect <image:tag>   # "Digest:" line
        include:
          - distro: debian
            image: mirror.gcr.io/library/debian:bookworm-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587 # bookworm-slim
          - distro: ubuntu
            image: mirror.gcr.io/library/ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac # 24.04
          - distro: arch
            image: mirror.gcr.io/library/archlinux:base-20261004.0.606936@sha256:4e77cf2ea5f410e6f8be5abf93ccf17ce2436e87a138c167208356711a405dbd # base-20261004.0.606936
          - distro: fedora
            image: mirror.gcr.io/library/fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 # 44
          - distro: rocky9
            image: quay.io/rockylinux/rockylinux:9@sha256:8101994123cf3d0a8fee517bee7f39e555c7d92bd2d9eb3303cc988a0eeed00f # 9
          - distro: rocky10
            image: quay.io/rockylinux/rockylinux:10@sha256:827d37bc128288ccf160ee318bb3cb92d591164cb217e92f8bc61e3982ae1834 # 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provision (${{ matrix.image }} / ${{ matrix.mode }})
        run: |
          # Retry up to 3x, fresh container each, to absorb network blips;
          # provisioning is idempotent, so a retry mostly re-checks.
          for attempt in 1 2 3; do
            echo "::group::provision attempt $attempt"
            # timeout: a hung attempt must fail into the retry. It kills only
            # the docker client, so kill the container too (it shares /repo).
            if timeout 900 docker run --rm \
              -e MODE='${{ matrix.mode }}' \
              -e GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
              -v "$PWD:/repo" -w /repo \
              '${{ matrix.image }}' \
              sh .github/scripts/provision-ci.sh; then
              echo "::endgroup::"; exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed" >&2
            docker ps -q | xargs -r docker kill >/dev/null 2>&1 || true
            [ "$attempt" -lt 3 ] && sleep 15
          done
          exit 1

  macos:
    # The real playbook on Apple Silicon, then a convergent second run. Casks
    # are skipped: slow, large, no CI signal.
    name: macos
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ansible-core from the repo toolchain (mise.toml + mise.lock). Only mise
      # and ansible go on PATH: the playbook installs the home tools itself.
      - name: Install mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.11
          # sha256 of mise-v2026.10.11-macos-arm64 (bump with `version`; Renovate
          # PRs need scripts/relock.sh for the sha256s).
          sha256: 62e86e51f834899610e9bd0ee37580cfe01fac5fff03002318e714fbdb86faeb
          install: false
          cache: false
          add_shims_to_path: false
          export_path: false
          env: false
      - name: Install the locked toolchain; put ansible (only) on PATH
        env:
          # Raises mise's GitHub API limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mise install --locked
          bin="$(dirname "$(mise which ansible-playbook)")"
          echo "$bin" >>"$GITHUB_PATH"
          echo "ANSIBLE_BIN=$bin" >>"$GITHUB_ENV"
          "$bin/ansible-playbook" --version
      # A Homebrew copy of a pinned tool must not win over mise's (asserted below).
      - name: Preinstall a Homebrew fzf
        run: brew install fzf
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: Write the CI machine vars (ansible/local.yml)
        run: |
          printf '%s\n' '---' 'git_name: CI' 'git_email: ci@example.com' 'allow_sudo: false' >ansible/local.yml
      - name: Provision (first run)
        working-directory: ansible
        env:
          # Raises mise's GitHub API limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ansible-playbook site.yml --skip-tags casks
      - name: Expose the dotfiles mise shims
        run: |
          # Each GITHUB_PATH line is prepended: ansible ends up ahead of the shims.
          echo "$HOME/.local/share/mise/shims" >>"$GITHUB_PATH"
          echo "$ANSIBLE_BIN" >>"$GITHUB_PATH"
          echo "MISE_SYSTEM_CONFIG_DIR=$HOME/.config/mise-dotfiles" >>"$GITHUB_ENV"
      - name: Assert tools
        run: ./.github/scripts/assert-tools.sh
      - name: Assert mise's fzf wins over Homebrew's
        run: |
          brew list fzf >/dev/null || {
            echo "FAIL: the Homebrew fzf is not installed (test precondition)" >&2
            exit 1
          }
          want="$(yq '.tools.fzf.version' home/.chezmoidata/tools.yaml)"
          # A hostile inherited PATH (brew-first shell or IDE): Homebrew and
          # ~/.local/bin ahead of the mise shims.
          hostile="/opt/homebrew/bin:$HOME/.local/bin:$HOME/.local/share/mise/shims:/usr/bin:/bin"
          for flags in -c -ic; do
            # From / (no repo mise.toml), through the deployed ~/.zshenv.
            path="$(cd / && env PATH="$hostile" zsh "$flags" 'command -v fzf' 2>/dev/null | tail -n1)"
            ver="$(cd / && env PATH="$hostile" zsh "$flags" 'fzf --version' 2>/dev/null | tail -n1 | awk '{print $1}')"
            echo "zsh $flags: fzf -> $path ($ver)"
            case "$path" in
            "$HOME/.local/share/mise/"*) ;;
            *)
              echo "FAIL: zsh $flags resolves fzf outside mise: $path" >&2
              exit 1
              ;;
            esac
            if [ "$ver" != "$want" ]; then
              echo "FAIL: zsh $flags runs fzf $ver, tools.yaml pins $want" >&2
              exit 1
            fi
          done
      - name: Provision (second run must be a no-op)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd ansible && ansible-playbook site.yml --skip-tags casks) >"$RUNNER_TEMP/run2.log" 2>&1 || {
            cat "$RUNNER_TEMP/run2.log"
            exit 1
          }
          cat "$RUNNER_TEMP/run2.log"
          ./.github/scripts/assert-idempotent.sh "$RUNNER_TEMP/run2.log"
      - name: Doctor (health check)
        run: |
          # Fail on every doctor FAIL line not matching ALLOW (each entry
          # needs a reason; empty = none tolerated).
          ALLOW='^NONE$'
          set +e
          sh scripts/doctor.sh | tee "$RUNNER_TEMP/doctor.log"
          set -e
          # The summary line proves doctor ran to the end.
          grep -q '^doctor: ' "$RUNNER_TEMP/doctor.log" || {
            echo "doctor did not run to completion" >&2
            exit 1
          }
          if grep -E '^FAIL' "$RUNNER_TEMP/doctor.log" | grep -vE "$ALLOW"; then
            echo "doctor reported unexpected FAIL lines (above)" >&2
            exit 1
          fi
          # The preinstalled Homebrew fzf must be reported as shadowed.
          grep -qF 'WARN  fzf also installed at /opt/homebrew/bin/fzf (shadowed); remove with: brew uninstall fzf' "$RUNNER_TEMP/doctor.log" || {
            echo "doctor did not report the shadowed Homebrew fzf" >&2
            exit 1
          }

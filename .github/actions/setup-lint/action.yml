name: setup-lint
description: Install zsh plus the repo-pinned lint toolchain (mise.toml + mise.lock) for lint jobs.
runs:
  using: composite
  steps:
    - name: Install zsh
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh ca-certificates
    # Cache mise's data dir, keyed on the lock plus this file (the mise
    # version): an unchanged lock is a pure hit with no GitHub API calls.
    - name: Cache mise tools
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/mise
        key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock', '.github/actions/setup-lint/action.yml') }}
    # mise pinned by version + sha256, tools from mise.lock only (--locked).
    # The action's own cache is off: the step above owns it.
    - name: Install mise and tools
      uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      with:
        version: 2026.10.11
        # sha256 of mise-v2026.10.11-linux-x64 (ubuntu-24.04 x64 only); bump
        # with `version`.
        sha256: f9612efcddda0ae55b62d3b6f82a6c860d5b54ebee0807d4f1a1d578055e1607
        install_args: --locked
        cache: false
    - name: Mark workspace safe for git
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

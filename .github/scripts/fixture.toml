# Per-machine data for rendering chezmoi templates in CI/pre-commit; mirrors
# ansible/local.yml.example. NO secrets.
[data]
    allow_sudo = true
    shared_home = false
    git_name = "CI"
    git_email = "ci@example.com"
    # Exercises the optional per-repo identity branch (config.tmpl, git/personal).
    personal_git_name = "ci-personal"
    personal_git_email = "1+ci-personal@users.noreply.github.com"
